steps:
  # Step 0: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank:latest'
      - '.'

  # Step 1: Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank'

  # Step 2: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'synthetic-bank'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Use ^:^ delimiter because CORS_ALLOWED_ORIGINS itself contains commas.
      # This lets us pass a comma-separated origin list as a single env var value.
      - '--set-env-vars'
      - '^:^GOOGLE_CLOUD_PROJECT=$PROJECT_ID:FIRESTORE_DATABASE=(default):USE_FIRESTORE=true:CORS_ALLOWED_ORIGINS=https://frab-frontend-200002205070.asia-south1.run.app,http://localhost:3000,http://localhost:5173,http://localhost:8080'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/frab-repo/synthetic-bank:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
